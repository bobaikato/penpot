version: 1
project:
  name: penpot
  description: >
    Compose-owned Penpot developer runtime slice with shared infra plus named workspace instances.
    The default instance is ws0, and additional wsN instances are selected through workflow-owned overlays.
  type: application
env:
  profiles:
    devenv:
      render:
        files:
          - path: .devenv/mcp/claude-code.json
            format: json
            sources:
              - .devenv/shared/claude-code.json
              - .devenv/templates/claude-code.json
          - path: .devenv/mcp/opencode.json
            format: json
            sources:
              - .devenv/shared/opencode.json
              - .devenv/templates/opencode.json
          - path: .vscode/mcp.json
            format: json
            merge_into_existing: true
            sources:
              - .devenv/shared/vscode.json
              - .devenv/templates/vscode.json
          - path: .devenv/mcp/codex.toml
            format: toml
            sources:
              - .devenv/shared/codex.toml
              - .devenv/templates/codex.toml
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
surfaces:
  ui:
    kind: https
    label: Penpot Dev UI (HTTPS)
    purpose: Canonical browser-facing developer surface for the selected workspace instance
    visibility: public
    port: 3449
    path: /
    readiness:
      kind: http
      method: GET
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
  ui:http:
    kind: http
    label: Penpot Dev UI (HTTP)
    purpose: Secondary plain-HTTP browser-facing developer surface for the selected workspace instance
    visibility: public
    port: 3450
    path: /
    readiness:
      kind: http
      method: GET
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
tasks:
  network:ensure:
    context: host
    description: Ensure the shared external penpot docker network exists
    action:
      kind: ensure_bundle
      steps:
        - kind: ensure_container_network
          name: penpot_shared
    requirements:
      tools:
        docker: "*"
  infra:up:
    context: host
    description: Start the shared infra compose project
    depends_on:
      - network:ensure
    adapter_inputs:
      compose:
        env_files:
          - docker/devenv/defaults.env
        files:
          - docker/devenv/docker-compose.infra.yml
        project_name: penpotdev-infra
    command:
      exe: docker
      args:
        - compose
        - up
        - -d
    requirements:
      tools:
        docker: "*"
  infra:down:
    context: host
    description: Stop the shared infra compose project
    adapter_inputs:
      compose:
        env_files:
          - docker/devenv/defaults.env
        files:
          - docker/devenv/docker-compose.infra.yml
        project_name: penpotdev-infra
    command:
      exe: docker
      args:
        - compose
        - down
        - -t
        - "2"
    requirements:
      tools:
        docker: "*"
  devenv:image:pull:
    context: host
    description: Pull the published Penpot devenv image before starting a workspace instance
    command:
      exe: docker
      args:
        - pull
        - penpotapp/devenv:latest
    requirements:
      tools:
        docker: "*"
    effects:
      network: true
      network_kind: dependency_hydration
      external_state:
        - docker
  devenv:up:
    context: host
    description: Start the selected main devenv container after shared infra is ready
    adapter_inputs:
      compose:
        env_files:
          - docker/devenv/defaults.env
        files:
          - docker/devenv/docker-compose.main.yml
        project_name: penpotdev-ws0
    env:
      CURRENT_USER_ID: ${OTA_HOST_UID}
      PENPOT_SOURCE_PATH: ${OTA_HOST_WORKSPACE}
      PENPOT_TENANT: ""
    runtime:
      kind: service
      surfaces:
        ui:
          project:
            host:
              primary: true
        ui:http: {}
      readiness:
        kind: http
        listener: ui:http
        path: /
        interval: 5s
        timeout: 5s
        retries: 60
        start_period: 60s
    command:
      exe: docker
      args:
        - compose
        - up
        - -d
        - main
    depends_on:
      - devenv:image:pull
    requirements:
      tools:
        docker: "*"
  devenv:session:start:
    context: host
    description: Start the detached tmux-backed Penpot dev processes inside the selected running main container
    adapter_inputs:
      compose:
        env_files:
          - docker/devenv/defaults.env
        files:
          - docker/devenv/docker-compose.main.yml
        project_name: penpotdev-ws0
    compose:
      kind: exec
      detach: true
      service: main
      exe: sh
      args:
        - -lc
        - sudo -EH -u penpot PENPOT_TMUX_ATTACH=false /home/start-tmux.sh
    requirements:
      tools:
        docker: "*"
    effects:
      network: true
      network_kind: dependency_hydration
      writes:
        - frontend/node_modules
        - exporter/node_modules
      external_state:
        - docker
  devenv:start:
    context: host
    description: Confirm the selected Penpot workspace instance is started after container and detached session bootstrap
    adapter_inputs:
      compose:
        env_files:
          - docker/devenv/defaults.env
        files:
          - docker/devenv/docker-compose.main.yml
        project_name: penpotdev-ws0
    env:
      CURRENT_USER_ID: ${OTA_HOST_UID}
      PENPOT_SOURCE_PATH: ${OTA_HOST_WORKSPACE}
      PENPOT_TENANT: ""
    runtime:
      kind: service
      surfaces:
        ui:
          project:
            host:
              primary: true
        ui:http: {}
      readiness:
        kind: http
        listener: ui:http
        path: /
        interval: 5s
        timeout: 5s
        retries: 60
        start_period: 60s
    command:
      exe: docker
      args:
        - compose
        - ps
        - main
    depends_on:
      - devenv:up
      - devenv:session:start
    requirements:
      tools:
        docker: "*"
  devenv:attach:
    context: host
    description: Attach to the running tmux session inside the selected Penpot workspace instance
    adapter_inputs:
      compose:
        env_files:
          - docker/devenv/defaults.env
        files:
          - docker/devenv/docker-compose.main.yml
        project_name: penpotdev-ws0
    compose:
      kind: attach
      service: main
      exe: sudo
      args:
        - -EH
        - -u
        - penpot
        - tmux
        - attach
        - -t
        - penpot
    requirements:
      tools:
        docker: "*"
  devenv:down:
    context: host
    description: Stop the selected main devenv compose project
    adapter_inputs:
      compose:
        env_files:
          - docker/devenv/defaults.env
        files:
          - docker/devenv/docker-compose.main.yml
        project_name: penpotdev-ws0
    env:
      CURRENT_USER_ID: ${OTA_HOST_UID}
      PENPOT_SOURCE_PATH: ${OTA_HOST_WORKSPACE}
      PENPOT_TENANT: ""
    command:
      exe: docker
      args:
        - compose
        - down
        - -t
        - "2"
    requirements:
      tools:
        docker: "*"
  verify:
    description: Run the narrow contract verification slice
    aggregate:
      tasks:
        - network:ensure
        - infra:up
workflows:
  default: devenv
  infra:
    intent: packaged_runtime
    description: Run the shared infra compose project with task-owned compose adapter truth
    run:
      task: infra:up
  devenv:
    intent: packaged_runtime
    description: >
      Bring up one selected Penpot workspace instance after shared infra using
      task-owned compose adapter truth and contract-owned host-derived env injection.
    env:
      profile: devenv
    prepare:
      task: infra:up
    instances:
      default: ws0
      ws0:
        description: Bind the live repo at OTA_HOST_WORKSPACE as the default Penpot workspace instance.
        env:
          PENPOT_MCP_PORT: "4401"
          SERENA_MCP_PORT: "14181"
      ws1:
        description: Bind the first cloned Penpot workspace under OTA_HOST_HOME for parallel development.
        topology:
          requires_instances:
            - ws0
        env:
          PENPOT_MCP_PORT: "14401"
          PENPOT_SOURCE_PATH: ${OTA_HOST_HOME}/.penpot/penpot_workspaces/ws1
          SERENA_MCP_PORT: "24181"
        tasks:
          devenv:start:
            adapter_inputs:
              compose:
                project_name: penpotdev-ws1
          devenv:up:
            adapter_inputs:
              compose:
                project_name: penpotdev-ws1
          devenv:session:start:
            adapter_inputs:
              compose:
                project_name: penpotdev-ws1
          devenv:attach:
            adapter_inputs:
              compose:
                project_name: penpotdev-ws1
          devenv:down:
            adapter_inputs:
              compose:
                project_name: penpotdev-ws1
        surfaces:
          ui:
            port: 13449
          ui:http:
            port: 13450
      ws2:
        description: Bind the second cloned Penpot workspace under OTA_HOST_HOME for parallel development.
        topology:
          requires_instances:
            - ws0
        env:
          PENPOT_MCP_PORT: "24401"
          PENPOT_SOURCE_PATH: ${OTA_HOST_HOME}/.penpot/penpot_workspaces/ws2
          SERENA_MCP_PORT: "34181"
        tasks:
          devenv:start:
            adapter_inputs:
              compose:
                project_name: penpotdev-ws2
          devenv:up:
            adapter_inputs:
              compose:
                project_name: penpotdev-ws2
          devenv:session:start:
            adapter_inputs:
              compose:
                project_name: penpotdev-ws2
          devenv:attach:
            adapter_inputs:
              compose:
                project_name: penpotdev-ws2
          devenv:down:
            adapter_inputs:
              compose:
                project_name: penpotdev-ws2
        surfaces:
          ui:
            port: 23449
          ui:http:
            port: 23450
      ci:
        description: Use a dedicated CI-safe workspace instance with non-default host ports for runtime proof.
        env:
          PENPOT_PUBLIC_URI: https://localhost:43449
          PENPOT_PUBLIC_HTTPS_PORT: "43449"
          PENPOT_PUBLIC_HTTP_PORT: "43450"
          PENPOT_MCP_PORT: "44401"
          PENPOT_MCP_REPL_PORT: "44403"
          SERENA_MCP_PORT: "54181"
          SHADOW_SERVER_URL: wss://localhost:43449
        tasks:
          devenv:start:
            adapter_inputs:
              compose:
                project_name: penpotdev-ci
          devenv:up:
            adapter_inputs:
              compose:
                project_name: penpotdev-ci
          devenv:session:start:
            adapter_inputs:
              compose:
                project_name: penpotdev-ci
          devenv:attach:
            adapter_inputs:
              compose:
                project_name: penpotdev-ci
          devenv:down:
            adapter_inputs:
              compose:
                project_name: penpotdev-ci
        surfaces:
          ui:
            port: 43449
          ui:http:
            port: 43450
    readiness:
      surfaces:
        - ui:http
    exposes:
      - surface: ui
      - surface: ui:http
    run:
      task: devenv:start
    attach:
      task: devenv:attach
agent:
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: branch
        branch: 1.6.22-implementation
metadata:
  ota:
    minimum_version: "1.6.22"
